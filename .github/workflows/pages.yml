# Build the site on every push; publish it to GitHub Pages from the default branch.
#
# One-time setup: in the repository go to Settings -> Pages -> "Build and deployment"
# and set Source to "GitHub Actions". After that every push to the default branch
# (or a manual run from the Actions tab) deploys the site.
name: Build and deploy to GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once, and let a running deployment finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the in-browser models against their reference values
        run: npm run test:ml

      - name: Build
        run: npm run build

      # Deploy only from the default branch (whatever it is called), never from pull requests.
      - name: Decide whether to deploy
        id: target
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.target.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload the site
        if: steps.target.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
